name: CI
on:
  push:
    branches: ["master","main","master"]
  pull_request:
    branches: ["master","main","master"]
  workflow_dispatch:
jobs:
  ci:
    uses: itsdarklikehell-interactive/ci-templates/.github/workflows/ci-generic.yml@v1
    with:
      dockerfile: ""

  ci-status:
    name: CI
    needs: ci
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require reusable CI success
        run: test "${{ needs.ci.result }}" = "success"
